<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Sector Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <div class="card">
            
            <div class="card-face card-front">
                <div class="card-content">
                    <div class="icon-box">
                        <i class="fa-solid fa-map-location-dot"></i>
                    </div>
                    <h2 class="main-title">Financial Sector Development Program</h2>
                    <p class="description">The Program aims to develop a diversified and effective financial sector to support the development of the Saudi Arabia's economy.</p>
                </div>
                
                <div class="card-footer">
                    <div class="read-more-btn">
                        <span class="btn-text">Read More</span>
                        <div class="arrow-circle">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-face card-back">
                <div class="card-overlay"></div>
                <div class="card-back-content">
                    <h2>Financial Sector Development Program</h2>
                    <div class="arrow-circle back-arrow">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
