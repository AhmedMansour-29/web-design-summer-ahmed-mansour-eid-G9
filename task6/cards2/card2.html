<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supercars Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="team-container">

    <div class="team-card">
      <div class="img-box">
        <img src="https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?q=80&w=600&auto=format&fit=crop" alt="Lamborghini Huracan">
      </div>
      <div class="info-box">
        <h4>Lamborghini</h4>
        <p>Huracán EVO</p>
      </div>
    </div>

    <div class="team-card">
      <div class="img-box">
        <img src="https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?q=80&w=600&auto=format&fit=crop" alt="Porsche 911 GT3 RS">
      </div>
      <div class="info-box">
        <h4>Porsche 911</h4>
        <p>GT3 RS Turbo</p>
      </div>
    </div>

    <div class="team-card">
      <div class="img-box">
        <img src="https://images.unsplash.com/photo-1583121274602-3e2820c69888?q=80&w=600&auto=format&fit=crop" alt="Ferrari F8">
      </div>
      <div class="info-box">
        <h4>Ferrari F8</h4>
        <p>Tributo Spider</p>
      </div>
    </div>

  </div>

</body>
</html>
